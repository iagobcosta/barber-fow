name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Validate package manifests
        run: |
          cd backend && npm run build --if-present
          cd ../frontend && npm run build --if-present

      - name: Run backend lint and tests
        run: |
          cd backend
          npm test

      - name: Run frontend build
        run: |
          cd frontend
          npm run build

      - name: Check spec files for valid Markdown
        run: |
          python - <<'PY'
          import os
          import glob
          import markdown
          fail = False
          for path in glob.glob('specs/**/*.md', recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  try:
                      markdown.markdown(f.read())
                  except Exception as e:
                      print(f'Failed to parse {path}: {e}')
                      fail = True
          if fail:
              raise SystemExit(1)
          PY
        shell: bash

      - name: Generate build artifacts summary
        run: |
          echo "Backend and frontend builds completed successfully."
